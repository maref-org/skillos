<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MAREF AI Logo Animation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; background: #0a0a1a;
  flex-direction: column;
  gap: 20px;
}
.container { width: 600px; height: 300px; display: flex; justify-content: center; align-items: center; }

/* 绘制动画 */
@keyframes draw {
  0% { stroke-dashoffset: 2000; }
  100% { stroke-dashoffset: 0; }
}

/* 淡入动画 */
@keyframes fadeIn {
  0% { opacity: 0; }
  100% { opacity: 1; }
}

/* 脉冲发光 */
@keyframes pulse {
  0%, 100% { 
    filter: drop-shadow(0 0 5px #165DFF);
    fill: #165DFF;
  }
  50% { 
    filter: drop-shadow(0 0 25px #00C6FF) drop-shadow(0 0 50px #165DFF);
    fill: #00C6FF;
  }
}

/* 文字脉冲 */
@keyframes textPulse {
  0%, 100% { 
    filter: drop-shadow(0 0 3px #165DFF);
    fill: #ffffff;
  }
  50% { 
    filter: drop-shadow(0 0 15px #00C6FF);
    fill: #00C6FF;
  }
}

/* 神经网络节点闪烁 */
@keyframes blink {
  0%, 100% { opacity: 0.3; r: 4; }
  50% { opacity: 1; r: 8; }
}

/* 应用动画 */
.letter-stroke {
  stroke-dasharray: 2000;
  stroke-dashoffset: 2000;
  animation: draw 2.5s ease-out forwards, pulse 2.5s ease-in-out 2.5s infinite;
}

.logo-text {
  opacity: 0;
  animation: fadeIn 1s ease-out 2s forwards, textPulse 3s ease-in-out 3s infinite;
}

.subtitle {
  opacity: 0;
  animation: fadeIn 1s ease-out 2.8s forwards;
}

.network-node {
  animation: blink 2s ease-in-out infinite;
}

.network-line {
  stroke-dasharray: 500;
  stroke-dashoffset: 500;
  animation: draw 1.5s ease-out 0.5s forwards;
}
</style>
</head>
<body>
<div class="container">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
    <!-- 神经网络连接线 (背景) -->
    <line x1="50" y1="30" x2="100" y2="70" stroke="#165DFF" stroke-width="1" class="network-line" style="opacity: 0.4"/>
    <line x1="550" y1="30" x2="500" y2="70" stroke="#165DFF" stroke-width="1" class="network-line" style="opacity: 0.4; animation-delay: 0.2s"/>
    <line x1="30" y1="170" x2="80" y2="130" stroke="#00C6FF" stroke-width="1" class="network-line" style="opacity: 0.4; animation-delay: 0.3s"/>
    <line x1="570" y1="170" x2="520" y2="130" stroke="#00C6FF" stroke-width="1" class="network-line" style="opacity: 0.4; animation-delay: 0.4s"/>
    
    <!-- 神经网络节点 -->
    <circle cx="50" cy="30" class="network-node" fill="#00C6FF" style="animation-delay: 0s"/>
    <circle cx="100" cy="70" class="network-node" fill="#165DFF" style="animation-delay: 0.2s"/>
    <circle cx="550" cy="30" class="network-node" fill="#00C6FF" style="animation-delay: 0.4s"/>
    <circle cx="500" cy="70" class="network-node" fill="#165DFF" style="animation-delay: 0.6s"/>
    <circle cx="30" cy="170" class="network-node" fill="#00C6FF" style="animation-delay: 0.3s"/>
    <circle cx="80" cy="130" class="network-node" fill="#165DFF" style="animation-delay: 0.5s"/>
    <circle cx="570" cy="170" class="network-node" fill="#00C6FF" style="animation-delay: 0.7s"/>
    <circle cx="520" cy="130" class="network-node" fill="#165DFF" style="animation-delay: 0.9s"/>
    
    <!-- MAREF 字母路径 - 带描边动画 -->
    <!-- M -->
    <path d="M100 100 L100 50 L120 75 L140 50 L140 100" stroke="#165DFF" stroke-width="3" fill="none" class="letter-stroke" style="animation-delay: 0s"/>
    <!-- A -->
    <path d="M155 100 L165 50 L175 100 M160 75 L170 75" stroke="#165DFF" stroke-width="3" fill="none" class="letter-stroke" style="animation-delay: 0.2s"/>
    <!-- R -->
    <path d="M190 100 L190 50 L215 50 Q225 50 225 62.5 Q225 75 215 75 L205 75 L215 100" stroke="#165DFF" stroke-width="3" fill="none" class="letter-stroke" style="animation-delay: 0.4s"/>
    <!-- E -->
    <path d="M230 100 L230 50 L255 50 M230 75 L250 75 M230 100 L255 100" stroke="#165DFF" stroke-width="3" fill="none" class="letter-stroke" style="animation-delay: 0.6s"/>
    <!-- F -->
    <path d="M270 100 L270 50 L295 50 M270 75 L290 75" stroke="#165DFF" stroke-width="3" fill="none" class="letter-stroke" style="animation-delay: 0.8s"/>
    
    <!-- MAREF 填充文字 -->
    <text x="175" y="82" text-anchor="middle" font-size="52" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif" class="logo-text" style="letter-spacing: 12px;">MAREF</text>
    
    <!-- 副标题 -->
    <text x="175" y="130" text-anchor="middle" font-size="11" fill="#00C6FF" font-family="Arial, sans-serif" class="subtitle" style="letter-spacing: 2px; opacity: 0.8;">Multi-Agent-Runtime-Engine-Framework</text>
    
    <!-- 装饰线 -->
    <line x1="50" y1="150" x2="300" y2="150" stroke="#165DFF" stroke-width="1" class="network-line" style="animation-delay: 1s"/>
  </svg>
</div>
</body>
</html>
