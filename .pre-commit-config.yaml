repos:
  - repo: local
    hooks:
      - id: athena-leak-check
        name: Athena leak check - paths/orgs/secrets
        entry: bash -c
        args:
          - |
            PROPRIETARY_PATTERNS=(
              "^SOUL\\.md$" "^IDENTITY\\.md$" "^HEARTBEAT\\.md$"
              "^TOOLS\\.md$" "^USER\\.md$" "^\\.openclaw/"
              "^agent_system/" "^internal/" "^\\.missions/"
              "^findings\\.md$" "^progress\\.md$" "^task_plan\\.md$"
              "^anthropic-reinforcement-plan\\.md$" "^harness-plan/"
              "^Pixelle-Video/" "^comfyui_workspace/" "^backups/"
            )
            EXFIL_PATTERNS=(
              "/Volumes/" "/Users/[A-Za-z]/" "file:///"
              "frankiehot-tech" "frankiehot@"
            )
            SECRET_PATTERNS=(
              "ghp_[A-Za-z0-9_-]\\{36,\\}" "gho_[A-Za-z0-9_-]\\{36,\\}"
              "nvapi-[A-Za-z0-9_-]\\{30,\\}" "sk-[A-Za-z0-9]\\{20,\\}"
              "AKIA[A-Z0-9]\\{16,\\}"
            )
            FAILED=0
            STAGED=$(git diff --cached --name-only 2>/dev/null)
            if [ -n "$STAGED" ]; then
              for pattern in "${PROPRIETARY_PATTERNS[@]}"; do
                matches=$(echo "$STAGED" | grep -E "$pattern" || true)
                if [ -n "$matches" ]; then
                  echo "FAIL: Proprietary files staged:"; echo "$matches"; FAILED=1
                fi
              done
            fi
            for pattern in "${EXFIL_PATTERNS[@]}"; do
              matches=$(git diff --cached -U5 -- . ':!.pre-commit-config.yaml' | grep -E "$pattern" | grep -v "^---" | grep -v "^+++" || true)
              if [ -n "$matches" ]; then
                echo "FAIL: Path/org leak: $pattern"; echo "$matches" | head -5; FAILED=1
              fi
            done
            for pattern in "${SECRET_PATTERNS[@]}"; do
              matches=$(git diff --cached -U20 -- . ':!.pre-commit-config.yaml' | grep -E "$pattern" | grep -v "^---" | grep -v "^+++" || true)
              if [ -n "$matches" ]; then
                echo "FAIL: Secret leak: $pattern"; echo "$matches" | head -5; FAILED=1
              fi
            done
            if [ $FAILED -ne 0 ]; then echo "COMMIT REJECTED - remove leaks first"; exit 1; fi
        language: system
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.0.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ["--fix", "--disable", "MD013", "MD033"]
