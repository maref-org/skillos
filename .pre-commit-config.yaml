repos:
  - repo: local
    hooks:
      - id: athena-leak-check
        name: Athena T3/T2 leak prevention
        entry: python3 scripts/check_staged_leaks.py
        language: system
        stages: [pre-commit]

      - id: athena-sanitize-push
        name: Athena pre-push sanitization (T3/T2 full repo scan)
        entry: bash scripts/sanitize-for-push.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        pass_filenames: false
        additional_dependencies: [types-requests]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^audit_logs/
      - id: trailing-whitespace
        exclude: ^audit_logs/
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: detect-private-key
