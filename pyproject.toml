[project]
name = "skillos"
version = "0.6.0-beta"
description = "SkillOS - Skill Execution Kernel with 5/25/70 Distribution (Open Source, AGPL-3.0)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [ { name = "maref-org" } ]
dependencies = [
    "PyYAML>=6.0",
    "croniter>=2.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "readability-lxml>=0.8",
    "requests>=2.31",
    "cryptography>=42.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
llm = [
    "litellm>=1.40.0",
]
postgres = [
    "psycopg2-binary>=2.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.23",
    "bandit>=1.9.4",
    "ruff>=0.15.16",
    "gitpython>=3.1.55",
    "alembic>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["kernel", "distribution", "protocol", "skillos", "negmarket"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120
lint.select = ["E", "F", "I", "N", "W"]
lint.ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["SIM", "E402"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git"]

[tool.hatch.build.targets.wheel]
packages = ["skillos"]
include = []
