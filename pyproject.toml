[project]
name = "skillos-os"
version = "0.6.0-beta.2"
description = "SkillOS - Skill Execution Kernel with 5/25/70 Distribution (Open Source, AGPL-3.0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [ { name = "SkillOS Contributors" } ]
dependencies = [
    "PyYAML>=6.0",
    "croniter>=2.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.28",
    "readability-lxml>=0.8",
    "requests>=2.32.5",
    "cryptography>=50.0.0",
    "sqlalchemy>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/maref-org/skillos"
Repository = "https://github.com/maref-org/skillos"

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
llm = [
    "litellm>=1.96.2",
]
postgres = [
    "psycopg2-binary>=2.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.23",
    "bandit>=1.9.4",
    "ruff>=0.15.16",
    "gitpython>=3.2.1",
    "alembic>=1.13",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp>=1.45.1",
    "prometheus-client>=0.20",
    "setuptools>=84.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["skillos"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120
lint.select = ["E", "F", "I", "N", "W"]
lint.ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["SIM", "E402", "N802", "N806", "E741"]
"skills/*/__init__.py" = ["N999"]

[tool.mypy]
python_version = "3.11"
files = ["skillos"]
ignore_missing_imports = true
exclude = ["skills", "skillos-contrib"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git"]

[tool.hatch.build.targets.wheel]
packages = ["skillos"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "migrations"
"alembic.ini" = "alembic.ini"
