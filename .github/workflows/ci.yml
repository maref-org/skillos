name: SkillOS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy type check
        run: mypy .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov --cov-report=term

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Bandit SAST
        run: bandit -r . -c pyproject.toml
      - name: pip-audit
        run: pip-audit
      - name: TruffleHog secret scan
        run: |
          pip install truffleHog
          truffleHog --regex --entropy=False . || true
      - name: Verify no HTTP defaults in production code
        run: |
          # 检查生产代码中是否还有默认 HTTP URL（开发环境变量除外）
          if grep -r '"http://' --include='*.py' . | grep -v 'SKILLOS_INSECURE' | grep -v 'test_'; then
            echo "ERROR: Found hardcoded HTTP URLs in production code"
            exit 1
          fi
          echo "No hardcoded HTTP URLs found in production code"

  dast:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start application for DAST scan
        run: |
          pip install -e ".[dev]"
          # 后台启动应用（假设有 CLI 启动命令）
          python -c "from skillos.db.engine import init_db; init_db()" &
          sleep 2
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
        continue-on-error: true
