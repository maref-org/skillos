name: SkillOS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,web]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check (release scope)
        run: ruff format --check skillos/ scripts/
      - name: Mypy type check
        run: mypy

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,web]"
      - name: Run tests with coverage
        run: pytest tests/ -q --cov=skillos --cov-report=term --cov-fail-under=80

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,web]"
      - name: Bandit SAST
        run: bandit -r skillos/ -c pyproject.toml --severity-level medium
      - name: pip-audit
        run: |
          pip-audit --skip-editable \
            --ignore-vuln GHSA-537c-gmf6-5ccf \
            --ignore-vuln GHSA-6v7p-g79w-8964
      - name: Secret scan (verified secrets only)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
      - name: Governance content scan
        run: bash scripts/sanitize-for-push.sh
      - name: Reject insecure HTTP defaults
        run: |
          if grep -rnE '=\s*"http://' --include='*.py' skillos/ \
            | grep -vE 'localhost|127\.0\.0\.1|SKILLOS_INSECURE'; then
            echo "ERROR: Found hardcoded HTTP URL defaults in production code"
            exit 1
          fi
          echo "No insecure HTTP defaults found"

  semgrep:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Semgrep (advisory)
        continue-on-error: true
        run: |
          pip install semgrep
          semgrep --config=.semgrep/rules/ --error --strict skillos/

  dast:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Start application for DAST scan
        run: |
          pip install -e ".[dev,web]"
          python -c "from skillos.db.engine import init_db; init_db()"
          uvicorn skillos.app:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Application is ready"
              break
            fi
            echo "Waiting for application... ($i/15)"
            sleep 2
          done
          curl -sf http://localhost:8000/health || { echo "ERROR: Application failed to start"; exit 1; }
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000/health'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
