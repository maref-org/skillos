name: Check Exfiltration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check-exfil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Governance content scan (tracked files, whole repo)
        run: bash scripts/sanitize-for-push.sh
